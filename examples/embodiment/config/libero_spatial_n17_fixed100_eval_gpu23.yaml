defaults:
- env/libero_spatial@env.train
- env/libero_spatial@env.eval
- model/gr00t_n1d7@actor.model
- training_backend/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor: 2-3
    rollout: 2-3
    env: 2-3
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: GR00T-RL-Fixed-Eval
    experiment_name: fixed100-placeholder
    logger_backends: []
    wandb_entity: liwuyu-cloudbutterfly
  max_epochs: 1
  max_steps: 1
  only_eval: true
  val_check_interval: 1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  weight_sync_interval: 1
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: false
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
env:
  group_name: EnvGroup
  train:
    total_num_envs: 16
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    auto_reset: true
    rollout_epoch: 1
    video_cfg:
      save_video: false
      info_on_video: false
    group_size: 1
    ignore_terminations: false
  eval:
    total_num_envs: 100
    group_size: 1
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    is_eval: true
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    rollout_epoch: 1
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    seed: 0
    specific_reset_id: null
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_type: gr00t_n1d7
    precision: bf16
    trust_remote_code: true
    is_lora: false
    action_dim: 7
    num_action_chunks: 16
    denoising_steps: 4
    obs_converter_type: libero
    embodiment_tag: libero_sim
    add_value_head: true
    rl_head_config:
      joint_logprob: false
      noise_method: flow_sde
      ignore_last: false
      safe_get_logprob: false
      noise_anneal: false
      noise_params:
      - 0.7
      - 0.3
      - 400
      noise_level: 0.5
      action_noise_scale: 0.1
      add_value_head: ${..add_value_head}
      chunk_critic_input: false
      detach_critic_input: true
      disable_dropout: true
      use_vlm_value: false
      value_vlm_mode: mean_token
      padding_value: 570
    num_steps: 4
    model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/GR00T-N1.7-LIBERO/libero_spatial
    backbone_model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/Cosmos-Reason2-2B
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 64
  seed: 1234
  enable_offload: false
  model:
    model_type: gr00t_n1d7
    model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/GR00T-N1.7-LIBERO/libero_spatial
    backbone_model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/Cosmos-Reason2-2B
    embodiment_tag: libero_sim
    add_value_head: true
    num_action_chunks: 16
    denoising_steps: 4
    precision: fp32
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    use_orig_params: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
reward:
  use_reward_model: false
critic:
  use_critic_model: false

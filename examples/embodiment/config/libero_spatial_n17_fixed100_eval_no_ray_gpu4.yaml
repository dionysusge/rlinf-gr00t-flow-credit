defaults:
- env/libero_spatial@env.eval
- model/gr00t_n1d7@actor.model
- override hydra/job_logging: stdout
- _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/

runner:
  task_type: embodied_fixed_no_ray
  resume_dir: null
  logger:
    log_path: ../results/fixed_no_ray
    project_name: GR00T-Residual-RL
    experiment_name: fixed-no-ray-placeholder
    logger_backends: []

actor:
  model:
    model_type: gr00t_n1d7
    model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/GR00T-N1.7-LIBERO/libero_spatial
    backbone_model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/Cosmos-Reason2-2B
    embodiment_tag: libero_sim
    precision: bf16
    action_dim: 7
    num_action_chunks: 16
    denoising_steps: 4
    add_value_head: false
    load_to_device: false
    rl_head_config:
      add_value_head: false
      action_noise_scale: 0.0
      disable_dropout: true
      padding_value: 570
      residual_policy:
        enabled: false
        force_zero: false
        bound: 0.1
        eval_scale: 1.0
        hidden_width: 512
        hidden_layers: 2
        initial_log_std: -2.5
        min_log_std: -5.0
        max_log_std: 1.0
        clip_normalized_action: false

env:
  eval:
    total_num_envs: 10
    group_size: 1
    auto_reset: true
    ignore_terminations: false
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    is_eval: true
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    eval_reset_offset: 0
    eval_reset_limit: 100
    seed: 0
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

direct_eval:
  # run_n17_residual_e0_fixed500.sh exposes physical GPU 4 as process cuda:0.
  model_device: cuda:0
  model_seed: 1234
  label: fixed-no-ray
  expected_trials: 100
  # 10 envs x 10 rounds x at most 16 chunks/episode = 160 decisions.
  max_decision_steps: 200

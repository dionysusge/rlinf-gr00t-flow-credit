defaults:
- env/libero_spatial@env.train
- env/libero_spatial@env.eval
- model/gr00t_n1d7@actor.model
- model/gr00t_n1d7@rollout.model
- training_backend/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 4-5
    rollout: 4-5
    env: 4-5

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: GR00T-Residual-RL-Fixed-Eval
    experiment_name: residual-fixed-eval-placeholder
    logger_backends: []
  max_epochs: 1
  max_steps: 1
  only_eval: true
  val_check_interval: 1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  weight_sync_interval: 1

algorithm:
  normalize_advantages: true
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  sampling_params:
    do_sample: false
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: EnvGroup
  train:
    total_num_envs: 16
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    auto_reset: true
    rollout_epoch: 1
    video_cfg:
      save_video: false
      info_on_video: false
    group_size: 1
    ignore_terminations: false
  eval:
    total_num_envs: 100
    group_size: 1
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    is_eval: true
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    rollout_epoch: 1
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    seed: 0

rollout:
  group_name: RolloutGroup
  backend: huggingface
  # Separate from env.eval.seed: this fixes GR00T's sampled flow latent.
  seed: 1234
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/GR00T-N1.7-LIBERO/libero_spatial
    backbone_model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/Cosmos-Reason2-2B
    precision: bf16
    rl_head_config:
      action_noise_scale: 0.0
      residual_policy:
        enabled: true
        force_zero: true
        bound: 0.1
        eval_scale: 1.0
        hidden_width: 512
        hidden_layers: 2
        initial_log_std: -2.5
        min_log_std: -5.0
        max_log_std: 1.0
        clip_normalized_action: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 64
  seed: 1234
  enable_offload: false
  model:
    model_type: gr00t_n1d7
    model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/GR00T-N1.7-LIBERO/libero_spatial
    backbone_model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/Cosmos-Reason2-2B
    embodiment_tag: libero_sim
    add_value_head: true
    num_action_chunks: 16
    denoising_steps: 4
    precision: fp32
    rl_head_config:
      action_noise_scale: 0.0
      residual_policy:
        enabled: true
        force_zero: true
        bound: 0.1
        eval_scale: 1.0
        hidden_width: 512
        hidden_layers: 2
        initial_log_std: -2.5
        min_log_std: -5.0
        max_log_std: 1.0
        clip_normalized_action: false
  optim:
    lr: 0.0001
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    use_orig_params: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16

reward:
  use_reward_model: false

critic:
  use_critic_model: false

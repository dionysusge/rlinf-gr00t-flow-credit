defaults:
- env/libero_spatial@env.train
- env/libero_spatial@env.eval
- model/gr00t_n1d7@actor.model
- override hydra/job_logging: stdout
- _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/

runner:
  task_type: policy_decorator
  logger:
    log_path: /data/Wayne/gzw/rlinf_gr00t_n17/results/policy_decorator_gr00t
    project_name: GR00T-Residual-RL
    experiment_name: PD-${policy_decorator.mode}-GR00T-N1.7-LIBERO-Spatial
    logger_backends:
    - wandb
    - tensorboard
    wandb_entity: liwuyu-cloudbutterfly

actor:
  model:
    model_type: gr00t_n1d7
    model_path: /data/Wayne/gzw/rlinf_gr00t_n17/models/GR00T-N1.7-LIBERO/libero_spatial
    backbone_model_path: /data/Wayne/gzw/gr00t_n1_7/models/Cosmos-Reason2-2B
    embodiment_tag: libero_sim
    precision: bf16
    action_dim: 7
    num_action_chunks: 16
    denoising_steps: 4
    add_value_head: false
    load_to_device: false
    rl_head_config:
      add_value_head: false
      action_noise_scale: 0.0
      disable_dropout: true
      padding_value: 570
      residual_policy:
        enabled: false

env:
  train:
    total_num_envs: 16
    group_size: 1
    auto_reset: true
    ignore_terminations: false
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    use_fixed_reset_state_ids: false
    use_ordered_reset_state_ids: false
    is_eval: false
    seed: 0
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    total_num_envs: 10
    group_size: 1
    auto_reset: true
    ignore_terminations: false
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    eval_reset_offset: 0
    eval_reset_limit: 100
    is_eval: true
    seed: 0
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

policy_decorator:
  # CUDA_VISIBLE_DEVICES=2,3 maps physical GPU 2 -> cuda:0 and GPU 3 -> cuda:1.
  model_device: cuda:0
  learner_device: cuda:1
  seed: 1234
  mode: zero_smoke
  action_horizon: 16
  action_dim: 7
  expected_context_dim: 3584
  residual_scale: 0.1
  clip_executed_action: false

  hidden_dim: 256
  hidden_layers: 3
  initial_log_std: -2.5
  min_log_std: -5.0
  max_log_std: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  initial_alpha: 0.1
  target_entropy: null
  discount: 0.99
  target_tau: 0.005
  max_grad_norm: 10.0

  replay_capacity: 20000
  replay_storage_dtype: float32
  learning_starts: 256
  batch_size: 256
  updates_per_step: 1
  progressive_exploration_steps: 100
  max_steps: 150
  checkpoint_interval: 30
  resume_path: null

  zero_smoke_episodes: 100
  # Success is evidence, not an adapter invariant. The hard gate is exact
  # executed==base identity, finite tensors, and completed episodes.
  zero_smoke_min_success_rate: null
  random_smoke_episodes: 20
  random_residual_std: 0.25
  random_smoke_min_successes: 1
  eval_episodes: 100
  success_window: 100
  skip_gate_check: false
